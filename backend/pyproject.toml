[project]
name = "alcohol-label-verification-backend"
version = "0.1.0"
description = "Backend for the AI-powered alcohol label verification prototype."
requires-python = ">=3.11,<3.13"
readme = "README.md"
license = { text = "Proprietary - take-home project" }
authors = [{ name = "Logan Wade" }]

dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    "python-multipart>=0.0.9",
    "rapidfuzz>=3.9.0",
    "Pillow>=10.4.0",
    "numpy>=1.26.0,<2.0.0",
    "opencv-python-headless>=4.10.0",
    # Phase 2: real local OCR provider (~500 MB combined; pre-downloaded at
    # Docker build time).  The StubOcrProvider remains available for tests
    # and local development without heavy deps (set ALV_OCR_PROVIDER=stub).
    "paddleocr>=2.7.0,<3.0.0",
    "paddlepaddle>=2.6.0,<3.0.0",
]

[project.optional-dependencies]
ocr = [
    # Kept for backwards compatibility; the real deps have moved to main.
]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",
    "ruff>=0.6.0",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "RUF"]
ignore = ["B008"]  # FastAPI Depends() in defaults is idiomatic

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-ra --strict-markers"
markers = [
    "real_ocr: marks tests that require a real OCR provider (deselect with -m 'not real_ocr')",
]
